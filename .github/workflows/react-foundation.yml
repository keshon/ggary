name: React foundation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GG_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:react
      - name: Svelte Bits UI pilot in Chromium
        run: npm run test:svelte-pilot:browser
      - name: Installed Svelte package consumer
        run: npm run smoke:svelte-packages
      - name: Ensure inventory is current
        run: git diff --exit-code -- packages/react/component-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-package-candidates
          path: |
            node_modules/.cache/react-release
            node_modules/.cache/svelte-release
          if-no-files-found: ignore
          retention-days: 7
